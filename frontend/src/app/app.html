<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" *ngIf="!isAuthRoute">
    <div class="sidebar-header">
      <a routerLink="/" class="sidebar-brand">
        <span class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 7V17L12 22L20 17V7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 22V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 7L12 12L4 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 12H12.01" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="sparkle"/>
          </svg>
        </span>
        <span class="brand-text">Promptly</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <span class="nav-section-label">Main Menu</span>
        <a routerLink="/prompts" routerLinkActive="active" class="nav-link">
          <span class="nav-link-icon">🔭</span>
          <span class="nav-link-text">Explore</span>
        </a>
        <a routerLink="/add-prompt" routerLinkActive="active" class="nav-link">
          <span class="nav-link-icon">💎</span>
          <span class="nav-link-text">Create New</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-section-label">Resources</span>
        <a routerLink="/how-to-use" routerLinkActive="active" class="nav-link">
          <span class="nav-link-icon">📚</span>
          <span class="nav-link-text">How to Use</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button (click)="toggleTheme()" class="btn-theme-switcher" [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <span class="theme-icon">{{ themeService.isDarkMode() ? '☀️' : '🌙' }}</span>
        <span class="theme-label">{{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}</span>
      </button>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="main-wrapper" [class.full-width]="isAuthRoute">
    <!-- Top Global Bar -->
    <header class="topbar" *ngIf="!isAuthRoute">
      <div class="topbar-left">
        <div class="breadcrumb">
          <span class="breadcrumb-item">Library</span>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-item active">Dashboard</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="global-actions">
          <ng-container *ngIf="authService.currentUser() as user; else loginBtn">
            <div class="profile-chip">
              <div class="avatar">{{ user.username.charAt(0).toUpperCase() }}</div>
              <span class="profile-name">{{ user.username }}</span>
              <button (click)="logout()" class="btn-icon-logout" title="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              </button>
            </div>
          </ng-container>
          <ng-template #loginBtn>
            <a routerLink="/login" class="btn-primary-small">Login</a>
          </ng-template>
        </div>
      </div>
    </header>

    <!-- Content Screen -->
    <main class="main-content">
      <div class="fade-in-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Floating Color Switcher -->
  <div class="color-switcher" [class.open]="isColorMenuOpen()">
    <button class="btn-color-toggle" (click)="toggleColorMenu()" aria-label="Change Primary Color">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
    </button>
    <div class="color-menu">
      <div class="color-menu-title">Select Theme</div>
      <div class="color-options">
        <button *ngFor="let color of themeColors" 
                class="color-option" 
                [class.active]="themeService.primaryColor().name === color.name"
                [style.background]="color.primary"
                [title]="color.name"
                (click)="setPrimaryColor(color)">
        </button>
      </div>
    </div>
  </div>
</div>
